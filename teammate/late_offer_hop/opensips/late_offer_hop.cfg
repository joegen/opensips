log_level=3
xlog_level=3
stderror_enabled=no
syslog_enabled=yes
syslog_facility=LOG_LOCAL0

udp_workers=4

mpath="/opt/opensips-4.0.2/lib/opensips/modules/"

loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
modparam("rr", "append_fromtag", 1)
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "rtpengine.so"
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:22222")

include_file "/opt/late_offer_hop/opensips/late_offer_hop.local.cfg"

route[lo_settings] {
  route(lo_local_settings);
  $var(lo_flags_mediant_side) = "RTP/AVP ICE=remove replace-origin-full codec-strip-all codec-except-PCMU codec-except-PCMA codec-except-G722 codec-except-telephone-event";
  $var(lo_flags_pbx_side) = "RTP/AVP ICE=remove codec-strip-all codec-except-PCMU codec-except-PCMA codec-except-G722 codec-except-telephone-event";
  $var(lo_template_media) = "m=audio 9 RTP/AVP 0 8 9 101\r\na=rtpmap:0 PCMU/8000\r\na=rtpmap:8 PCMA/8000\r\na=rtpmap:9 G722/8000\r\na=rtpmap:101 telephone-event/8000\r\na=fmtp:101 0-15\r\na=sendrecv\r\n";
  $var(lo_ack_op) = "answer";   # DQ-7 test switch: "answer" (option a) or "offer" (option b); removed once DQ-7 is settled
}

route {
  route(lo_settings);
  if (!mf_process_maxfwd_header(10)) { send_reply(483, "Too Many Hops"); exit; }
  if (has_totag()) {
    if (is_method("ACK") && t_check_trans()) { t_relay(); exit; }
    if (!loose_route()) { if (!is_method("ACK")) { send_reply(404, "Not here"); } exit; }
    if (!is_method("ACK")) { t_check_trans(); }
    if (check_route_param(";lo-conv=")) { route(lo_converted_in_dialog); }
    if (!t_relay()) { if (!is_method("ACK")) { send_reply(500, "Server Internal Error"); } }
    exit;
  }
  if (is_method("CANCEL")) { if (t_check_trans()) { t_relay(); } exit; }
  t_check_trans();
  if (is_method("INVITE")) {
    record_route();
    if ($rb == NULL) { route(lo_convert); }
  }
  $du = $var(lo_karoo_uri);
  if (!t_relay()) { send_reply(500, "Server Internal Error"); }
  exit;
}

route[lo_convert] {
  if (list_hdr_has_option("Require", "100rel")) {
    append_to_reply("Unsupported: 100rel\r\n");
    t_reply(420, "Bad Extension");
    exit;
  }
  list_hdr_remove_option("Supported", "100rel");
  add_rr_param(";lo-conv=$cs");
  $var(lo_offer_in) = "v=0\r\no=- " + $Ts + $(Tsm{s.fill.left,0,6}) + " 1 IN IP4 " + $si + "\r\ns=-\r\nc=IN IP4 " + $si + "\r\nt=0 0\r\n" + $var(lo_template_media);
  if (!rtpengine_offer($var(lo_flags_mediant_side), , $var(lo_offer_out), $var(lo_offer_in))) {
    xlog("L_ERR", "late-offer hop: rtpengine_offer failed at S1, call-id $ci\n");
    t_reply(500, "Server Internal Error");
    exit;
  }
  if (!add_body_part($var(lo_offer_out), "application/sdp")) {
    xlog("L_ERR", "late-offer hop: add_body_part failed at S1, call-id $ci\n");
    rtpengine_delete("fast");
    t_reply(500, "Server Internal Error");
    exit;
  }
  t_on_reply("lo_initial_reply");
  t_on_failure("lo_initial_failure");
  $du = $var(lo_karoo_uri);
  if (!t_relay()) { rtpengine_delete("fast"); send_reply(500, "Server Internal Error"); }
  exit;
}

onreply_route[lo_initial_reply] {
  route(lo_settings);
  if ($rs < 200) {
    if (has_body("application/sdp")) { remove_body_part(); }
    exit;
  }
  if ($rs >= 300) { exit; }
  if (!has_body("application/sdp")) { xlog("L_WARN", "late-offer hop: 2xx without SDP at S3, call-id $ci\n"); exit; }
  if (!rtpengine_answer($var(lo_flags_pbx_side))) {
    xlog("L_ERR", "late-offer hop: rtpengine_answer failed at S3, call-id $ci\n");
    remove_body_part();
  }
  exit;
}

failure_route[lo_initial_failure] {
  if (!rtpengine_delete("fast")) { xlog("L_WARN", "late-offer hop: rtpengine_delete failed after a failed INVITE, call-id $ci\n"); }
}

route[lo_converted_in_dialog] {
  if (is_method("ACK")) {
    if (!has_body("application/sdp")) { return; }
    if (is_direction("downstream") && $cs == $(rr_params{param.value,lo-conv})) { route(lo_initial_ack); return; }
    route(lo_late_reoffer_ack);
    return;
  }
  if (is_method("BYE")) {
    if (!rtpengine_delete("fast")) { xlog("L_WARN", "late-offer hop: rtpengine_delete failed for BYE, call-id $ci\n"); }
    return;
  }
  if (!is_method("INVITE|UPDATE")) { return; }
  if ($rb == NULL) {
    if (is_method("INVITE")) {
      if (is_direction("downstream")) { t_on_reply("lo_late_reoffer_reply_to_pbx"); }
      else { t_on_reply("lo_late_reoffer_reply_to_karoo"); }
    }
    return;
  }
  if (!has_body("application/sdp")) { return; }
  if (is_direction("downstream")) {
    if (!rtpengine_offer($var(lo_flags_mediant_side))) { route(lo_reject_reoffer); }
    t_on_reply("lo_reoffer_reply_to_pbx");
  } else {
    if (!rtpengine_offer($var(lo_flags_pbx_side))) { route(lo_reject_reoffer); }
    t_on_reply("lo_reoffer_reply_to_karoo");
  }
}

route[lo_reject_reoffer] {
  xlog("L_ERR", "late-offer hop: rtpengine_offer failed at S6, call-id $ci\n");
  append_to_reply("Retry-After: 5\r\n");
  t_reply(500, "Server Internal Error");
  exit;
}

route[lo_initial_ack] {
  if ($var(lo_ack_op) == "offer") {
    if (!rtpengine_offer($var(lo_flags_mediant_side), , $var(lo_discard))) { xlog("L_ERR", "late-offer hop: S4 offer failed, call-id $ci\n"); }
  } else {
    if (!rtpengine_answer($var(lo_flags_mediant_side), , $var(lo_discard))) { xlog("L_ERR", "late-offer hop: S4 answer failed, call-id $ci\n"); }
  }
  remove_body_part();
}

route[lo_late_reoffer_ack] {
  if (is_direction("downstream")) {
    if (!rtpengine_answer($var(lo_flags_mediant_side))) { xlog("L_ERR", "late-offer hop: S7 ACK answer failed, call-id $ci\n"); remove_body_part(); }
  } else {
    if (!rtpengine_answer($var(lo_flags_pbx_side))) { xlog("L_ERR", "late-offer hop: S7 ACK answer failed, call-id $ci\n"); remove_body_part(); }
  }
}

onreply_route[lo_reoffer_reply_to_pbx] {
  route(lo_settings);
  if ($rs < 200) { if (has_body("application/sdp")) { remove_body_part(); } exit; }
  if ($rs >= 300) { exit; }
  if (!has_body("application/sdp")) { xlog("L_WARN", "late-offer hop: S6 2xx without SDP, call-id $ci\n"); exit; }
  if (!rtpengine_answer($var(lo_flags_pbx_side))) { xlog("L_ERR", "late-offer hop: S6 answer failed, call-id $ci\n"); remove_body_part(); }
}

onreply_route[lo_reoffer_reply_to_karoo] {
  route(lo_settings);
  if ($rs < 200) { if (has_body("application/sdp")) { remove_body_part(); } exit; }
  if ($rs >= 300) { exit; }
  if (!has_body("application/sdp")) { xlog("L_WARN", "late-offer hop: S6 2xx without SDP, call-id $ci\n"); exit; }
  if (!rtpengine_answer($var(lo_flags_mediant_side))) { xlog("L_ERR", "late-offer hop: S6 answer failed, call-id $ci\n"); remove_body_part(); }
}

onreply_route[lo_late_reoffer_reply_to_pbx] {
  route(lo_settings);
  if ($rs < 200) { if (has_body("application/sdp")) { remove_body_part(); } exit; }
  if ($rs >= 300) { exit; }
  if (!has_body("application/sdp")) { xlog("L_WARN", "late-offer hop: S7 2xx offer without SDP, call-id $ci\n"); exit; }
  if (!rtpengine_offer($var(lo_flags_pbx_side))) { xlog("L_ERR", "late-offer hop: S7 2xx offer failed, call-id $ci\n"); remove_body_part(); }
}

onreply_route[lo_late_reoffer_reply_to_karoo] {
  route(lo_settings);
  if ($rs < 200) { if (has_body("application/sdp")) { remove_body_part(); } exit; }
  if ($rs >= 300) { exit; }
  if (!has_body("application/sdp")) { xlog("L_WARN", "late-offer hop: S7 2xx offer without SDP, call-id $ci\n"); exit; }
  if (!rtpengine_offer($var(lo_flags_mediant_side))) { xlog("L_ERR", "late-offer hop: S7 2xx offer failed, call-id $ci\n"); remove_body_part(); }
}
